name: CI/CD Pipeline - Althea DevOps

on:
  push:
    branches:
      - main # Déclenchement automatique uniquement lors d'un push/merge sur la branche de production

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Authentification au registre de conteneurs Azure (ACR) de manière sécurisée via les GitHub Secrets
      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Construction de l'image Nginx personnalisée avec deux tags : le SHA unique du commit (traçabilité) et 'latest'
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/althea-web:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/althea-web:latest \
            ./app/web-custom

      # Envoi des deux tags vers le registre privé Azure
      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/althea-web:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/althea-web:latest

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push # Garantit que le déploiement ne s'exécute que si l'étape de build a réussi

    steps:
      # Connexion à la VM Azure via SSH et mise à jour des conteneurs
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/Sujet-Devops
            git fetch origin main
            git reset --hard origin/main
            # Recréation des conteneurs avec les images nouvellement poussées
            docker compose -f app/docker-compose.yml down
            docker compose -f app/docker-compose.yml up -d --build
            echo "Deployment successful"
