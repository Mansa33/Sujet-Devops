name: CI/CD Pipeline - Althea DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/althea-web:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/althea-web:latest \
            ./app/web-custom

      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/althea-web:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/althea-web:latest

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/Sujet-Devops
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose -f app/docker-compose.yml up -d --build --force-recreate
            echo "Deployment successful"
