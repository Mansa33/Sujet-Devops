version: '3.8'

services:
  # Prometheus — collecte les metriques de tous les services
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
    networks:
      - app_althea-net

  # Node Exporter — expose les metriques systeme de la VM (CPU, RAM, disque)
  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always
    networks:
      - app_althea-net

  # Grafana — visualisation des metriques et logs via dashboards
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: always
    networks:
      - app_althea-net

  # Loki — agregation et stockage centralisé des logs
  loki:
    image: grafana/loki
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
    networks:
      - app_althea-net

  # Promtail — agent qui collecte les logs systeme et les envoie a Loki
  promtail:
    image: grafana/promtail
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: always
    networks:
      - app_althea-net

volumes:
  # Volume persistant pour les dashboards et datasources Grafana
  grafana-data:

# Reseau externe cree par le stack app (docker-compose.yml)
# Le monitoring rejoint ce reseau pour acceder aux metriques des containers
networks:
  app_althea-net:
    external: true
