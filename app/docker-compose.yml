version: '3.8'

services:
  # Service Web Front-End — Nginx avec image Alpine securisee
  web-server:
    build: ./web-custom
    container_name: althea-web
    ports:
      - "80:80"
    restart: always
    networks:
      - althea-net
    depends_on:
      - db-patient

  # Service Base de donnees — PostgreSQL 15 avec donnees persistantes
  db-patient:
    image: postgres:15
    container_name: althea-db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${DB_NAME}
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - althea-net

# Reseau prive isole pour la communication entre web et base de donnees
networks:
  althea-net:
    driver: bridge

# Volume persistant pour les donnees PostgreSQL
volumes:
  db-data:

althea-nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: althea-nginx-exporter
    command:
      - -nginx.scrape-uri=http://althea-web:80/metrics
    networks:
      - althea-net
    depends_on:
      - althea-web
